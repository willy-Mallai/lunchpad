<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Soft drop shadow for an elevated, enterprise feel -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3F5B8D" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Left Fin -->
    <path d="M20 34 L8 48 L24 48 Z" fill="#3F5B8D" />
    
    <!-- Right Fin (Darker shade for 3D depth) -->
    <path d="M44 34 L56 48 L40 48 Z" fill="#2B4066" />
    
    <!-- Left Fuselage -->
    <path d="M32 6 C32 6 20 16 20 36 C20 45 24 48 24 48 L32 48 Z" fill="#3F5B8D" />
    
    <!-- Right Fuselage (Darker shade for 3D depth) -->
    <path d="M32 6 C32 6 44 16 44 36 C44 45 40 48 40 48 L32 48 Z" fill="#2B4066" />
    
    <!-- Engine Base -->
    <path d="M26 48 L38 48 L36 52 L28 52 Z" fill="#1C2A44" />
    
    <!-- Thruster Flame (Subtle monochromatic transparency) -->
    <path d="M28 52 L32 62 L36 52 Z" fill="#3F5B8D" opacity="0.6" />
    
    <!-- Window Outer -->
    <circle cx="32" cy="24" r="5" fill="#FFFFFF" />
    
    <!-- Window Inner Highlight (Adds subtle detail that scales well) -->
    <circle cx="32" cy="24" r="3" fill="#F1F5F9" />
  </g>
</svg>